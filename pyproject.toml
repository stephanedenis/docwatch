[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "docwatch"
dynamic = ["version"]
description = "Service local d'affichage vivant pour collections de documents Markdown éditées par d'autres processus."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Stéphane Denis" }]
keywords = ["markdown", "documentation", "viewer", "live", "watch", "reload", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mistune>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5", "websocket-client>=1.7"]

[project.scripts]
docwatch = "docwatch.cli:main"
docopen = "docwatch.docopen:main"

[project.urls]
Homepage = "https://github.com/stephanedenis/docwatch"
Source = "https://github.com/stephanedenis/docwatch"
Issues = "https://github.com/stephanedenis/docwatch/issues"

[tool.hatch.version]
path = "src/docwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
